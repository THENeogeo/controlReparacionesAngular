<div class="admin-layout-container">
  <header class="bg-primary text-white p-3 shadow-sm d-flex justify-content-between align-items-center">
    
    <div class="d-flex align-items-center gap-3">
      <img src="assets/ste.png" alt="Logo STE" class="ste-logo">
      <h4 class="m-0 fw-bold">Control de Reparaciones</h4>
    </div>

    <!-- Menú de usuario desplegable -->
    <div class="position-relative">
      
      <!-- Botón tipo píldora con el avatar y el nombre -->
      <button 
        class="btn btn-primary text-white d-flex align-items-center gap-2 border-0 shadow-none px-3 py-1 rounded-pill" 
        style="background-color: rgba(255, 255, 255, 0.15);"
        (click)="menuPerfilAbierto = !menuPerfilAbierto">
        
        <!-- Ícono de avatar -->
        <div class="d-flex justify-content-center align-items-center bg-white text-primary rounded-circle shadow-sm" style="width: 32px; height: 32px;">
            <i class="fa fa-user"></i>
        </div>
        
        <!-- Nombre de usuario -->
        <span class="fw-semibold" style="letter-spacing: 0.3px;">{{ nombreUsuario }}</span>
        
        <!-- Flecha de despliegue -->
        <i class="fa ms-1" [ngClass]="menuPerfilAbierto ? 'fa-chevron-up' : 'fa-chevron-down'" style="font-size: 0.8rem;"></i>
      </button>

      <!-- Tarjeta flotante -->
      <div 
        class="dropdown-menu dropdown-menu-end shadow mt-2" 
        [class.show]="menuPerfilAbierto" 
        [style.display]="menuPerfilAbierto ? 'block' : 'none'"
        style="position: absolute; right: 0; min-width: 220px; z-index: 1050;">
        
        <!-- Información extra del usuario -->
        <div class="px-4 py-3 border-bottom bg-light rounded-top text-center">
          <!-- Hacemos el avatar más grande adentro del menú -->
          <!-- <div class="d-inline-flex justify-content-center align-items-center bg-primary text-white rounded-circle mb-2 shadow-sm" style="width: 48px; height: 48px;">
            <i class="fa fa-user fs-4"></i>
          </div> -->
          <small class="text-muted d-block fw-semibold" style="font-size: 0.75rem;">SESIÓN INICIADA</small>
          <span class="fw-bold text-dark fs-6">{{ nombreUsuario }}</span>
        </div>
        
        <!-- Opciones del menú -->
        <div class="py-2">
          <button class="dropdown-item py-2 text-danger fw-semibold d-flex align-items-center" (click)="cerrarSesion()">
            <i class="fa fa-sign-out-alt me-3 fs-5"></i> Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
    
    <!-- Fondo invisible para cerrar el menú al hacer clic fuera de él -->
    <div 
      *ngIf="menuPerfilAbierto" 
      class="position-fixed top-0 start-0 w-100 h-100" 
      style="z-index: 1040;" 
      (click)="menuPerfilAbierto = false">
    </div>

  </header>

  <div class="d-flex">
    <aside style="width: 250px; min-height: 100vh; background: #35424e; color: white;" class="p-3">
      <p class="fw-bold text-uppercase mb-3" style="letter-spacing: 1px;">Menú</p>
      
      <ul class="nav flex-column gap-2">
        <li class="nav-item">
          <a class="nav-link text-white" href="/dashboard">Inicio</a>
        </li>

        <!-- Administración  -->
        <li class="nav-item">
          <a class="nav-link text-white d-flex justify-content-between align-items-center" 
            style="cursor: pointer;" 
            (click)="menuAdminAbierto = !menuAdminAbierto">
            <span>Administración</span>
            <i class="fa" [ngClass]="menuAdminAbierto ? 'fa-chevron-down' : 'fa-chevron-right'"></i>
          </a>
          
          <ul class="nav flex-column ms-3 mt-1" *ngIf="menuAdminAbierto">
            <li class="nav-item">
              <a class="nav-link text-white" href="/usuarios">Usuarios</a>
            </li>
          </ul>

          <!-- <ul class="nav flex-column ms-3 mt-1" *ngIf="menuAdminAbierto">
            <li class="nav-item">
              <a class="nav-link text-white" href="/reparaciones">Reparaciones</a>
            </li>
          </ul> -->

          <ul class="nav flex-column ms-3 mt-1" *ngIf="menuAdminAbierto">
            <li class="nav-item">
              <a class="nav-link text-white" href="/catalogos-admin">Catálogos</a>
            </li>
          </ul>
        </li>

        <!-- Solicitudes  -->
        <li class="nav-item">
          <a class="nav-link text-white d-flex justify-content-between align-items-center"
            style="cursor: pointer;" 
            (click)="menuSolicitudesAbierto = !menuSolicitudesAbierto">
            <span>Solicitudes</span>
            <i class="fa menu-arrow" [ngClass]="menuSolicitudesAbierto ? 'fa-chevron-down' : 'fa-chevron-right'"></i>
          </a>
          
          <ul class="nav flex-column ms-3 mt-1" *ngIf="menuSolicitudesAbierto">
            <li class="nav-item">
              <a class="nav-link text-white" href="/reparaciones">Reparaciones</a>
            </li>
          </ul>
        </li>

      </ul>
    </aside>

    <main class="flex-grow-1 bg-light p-4">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
