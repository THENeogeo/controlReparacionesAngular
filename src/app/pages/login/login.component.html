<div class="login-wrapper">
  <div class="login-split-card mat-elevation-z4">
    
    <div class="panel-left">
      <div class="welcome-text-container">
        <h1 class="welcome-heading">¡Bienvenido!</h1>
      </div>
    </div>

    <div class="panel-right">
      <div class="form-container">
        <h2 class="system-title">Sistema de Control de Reparaciones</h2>
        
        <form (submit)="$event.preventDefault(); handleLogin()" class="login-form">
          
          <div class="custom-input-group">
            <mat-icon>person</mat-icon>
            <input matInput [ngModel]="username()" (ngModelChange)="username.set($event)" name="username" required autocomplete="username" placeholder="Usuario">
          </div>

          <div class="custom-input-group">
            <mat-icon>lock</mat-icon>
            <input matInput type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required autocomplete="current-password" placeholder="Contraseña">
          </div>

          <button mat-raised-button color="primary" class="login-button" type="submit" [disabled]="loading()">
            {{ loading() ? 'Iniciando sesión...' : 'Entrar' }}
          </button>
        </form>
        
        <p class="copyright-text">Copyright© 2026</p>
      </div>
    </div>
  </div>
</div>
