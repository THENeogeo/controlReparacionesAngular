<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>STE - Control de Reparaciones</mat-card-title>
      <mat-card-subtitle>Inicie sesión para continuar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (submit)="$event.preventDefault(); handleLogin()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput [ngModel]="username()" (ngModelChange)="username.set($event)" name="username" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required>
        </mat-form-field>

        <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="loading()">
          {{ loading() ? 'Entrando...' : 'Ingresar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
